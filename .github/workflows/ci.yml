name: CI

on:
  pull_request:
  push:

jobs:
  verify-bashutils:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: install bats-core
        run: |
          ./helper.sh reqs
      - name: bash syntax check
        run: |
          bash -n bashutils-template.sh && bash -n .bashutils
      - name: run bats tests
        run: ./helper.sh test
      - name: Verify .bashutils is up to date
        run: |
          ./helper.sh build
          git diff --exit-code -- .bashutils
      - name: Create release artifacts
        run: ./helper.sh create_release_artifacts
      - name: Create GitHub release
        run: ./helper.sh create_github_release
        env: 
          RELEASE_DRAFT: "true"
          GH_TOKEN: ${{ github.token }}
      - name: 'commit and push updated version file'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .version
          git diff --cached --quiet || git commit -m "auto: update .version [skip ci]"
          git push

