name: CI

on:
  pull_request:
  push:

jobs:
  verify-bashutils:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: install bats-core
        run: |
          ./helper.sh reqs
      - name: bash syntax check
        run: |
          bash -n bashutils-template.sh && bash -n .bashutils
      - name: run bats tests
        run: ./helper.sh test
      - name: Verify .bashutils is up to date
        run: |
          ./helper.sh build_bashutils
          git diff --exit-code -- .bashutils
      - name: Create release artifacts
        run: ./helper.sh create_release_artifacts
      - name: Create GitHub release
        run: ./helper.sh create_github_release
        env: 
          RELEASE_DRAFT: "true"
